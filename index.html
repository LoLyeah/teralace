<!doctype html>
<html lang="en" class="dark" style="background-color: #0a101d; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Teralace - TeraBox Downloader</title>
    <style>
      :root {
        color-scheme: dark;
        background-color: #0a101d;
      }
      html,
      body {
        background-color: #0a101d;
        color: #f1f5f9;
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      html.light,
      html.light body {
        color-scheme: light;
        background-color: #f8fafc;
        color: #0f172a;
      }
    </style>
    <script>
      try {
        if (window.AndroidTheme && typeof window.AndroidTheme.getMonetColors === 'function') {
          var c = window.AndroidTheme.getMonetColors();
          if (c) window.__MONET_COLORS__ = JSON.parse(c);
        }
        var savedTheme = localStorage.getItem('vite-ui-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = savedTheme ? (savedTheme === 'dark' || (savedTheme === 'system' && prefersDark)) : true;
        if (savedTheme === 'light' || (!isDark && savedTheme)) {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.documentElement.style.backgroundColor = '#f8fafc';
          document.documentElement.style.colorScheme = 'light';
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.documentElement.style.backgroundColor = '#0a101d';
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
