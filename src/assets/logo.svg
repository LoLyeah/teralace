<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Negative-space mask for Material Design layered separation -->
    <mask id="logoArrowMask">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF" />
      <rect x="214" y="94" width="84" height="250" rx="42" fill="#000000" />
      <path d="M 136 280 L 256 438 L 376 280 Z"
            fill="#000000" stroke="#000000" stroke-width="32" stroke-linejoin="round" stroke-linecap="round" />
    </mask>
    <filter id="logoDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <g transform="translate(0, 18)" filter="url(#logoDropShadow)">
    <!-- Storage Circle Ring (#334155 Slate Navy) -->
    <circle cx="256" cy="205" r="136" fill="none" stroke="#334155" stroke-width="48" mask="url(#logoArrowMask)" />

    <!-- Downloader Arrow (#7DD3FC Glacier Ice-Blue) -->
    <!-- Vertical Pill Stem -->
    <rect x="230" y="110" width="52" height="218" rx="26" fill="#7DD3FC" />
    <!-- Downward Chevron Head -->
    <path d="M 152 292
             L 256 422
             L 360 292
             Z"
          fill="#7DD3FC" stroke="#7DD3FC" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />
  </g>
</svg>
