<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Primary Cyan to Blue Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Light Stream Gradient -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Background Cyber Speed Stream Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="2">
    <line x1="160" y1="80" x2="160" y2="432" stroke-dasharray="8 12" />
    <line x1="256" y1="60" x2="256" y2="452" stroke-dasharray="12 16" />
    <line x1="352" y1="80" x2="352" y2="432" stroke-dasharray="8 12" />
  </g>

  <!-- Glowing Shadow Layer -->
  <g filter="url(#glow)" opacity="0.45">
    <path d="M140 160 C 140 142, 154 128, 172 128 L 340 128 C 358 128, 372 142, 372 160 C 372 178, 358 192, 340 192 L 284 192 L 284 276 L 336 276 C 348 276, 354 290, 346 298 L 266 384 C 260 390, 252 390, 246 384 L 166 298 C 158 290, 164 276, 176 276 L 228 276 L 228 192 L 172 192 C 154 192, 140 178, 140 160 Z" fill="url(#accentGrad)" />
  </g>

  <!-- Core TeraLace Emblem -->
  <!-- Top Crossbar with woven lace contour -->
  <path d="M 148 160 C 148 144, 160 132, 176 132 L 336 132 C 352 132, 364 144, 364 160 C 364 176, 352 188, 336 188 L 280 188 L 280 270 L 332 270 C 346 270, 353 287, 343 297 L 265 381 C 260 386, 252 386, 247 381 L 169 297 C 159 287, 166 270, 180 270 L 232 270 L 232 188 L 176 188 C 160 188, 148 176, 148 160 Z" 
        fill="url(#primaryGrad)" />

  <!-- Interwoven Dynamic Lace Ribbons (Left & Right Flanks) -->
  <!-- Left Speed Ribbon -->
  <path d="M 132 210 C 132 200, 140 194, 150 194 L 192 194 C 202 194, 210 202, 210 212 L 210 270 C 210 278, 204 284, 196 284 L 150 284 C 138 284, 132 270, 140 260 L 160 236 L 140 220 C 134 216, 132 213, 132 210 Z" 
        fill="url(#accentGrad)" opacity="0.85" />

  <!-- Right Speed Ribbon -->
  <path d="M 380 210 C 380 200, 372 194, 362 194 L 320 194 C 310 194, 302 202, 302 212 L 302 270 C 302 278, 308 284, 316 284 L 362 284 C 374 284, 380 270, 372 260 L 352 236 L 372 220 C 378 216, 380 213, 380 210 Z" 
        fill="url(#accentGrad)" opacity="0.85" />

  <!-- Inner High-Velocity Arrow Tip Glow -->
  <polygon points="256,368 288,332 224,332" fill="#e0f2fe" filter="url(#subtleGlow)" opacity="0.95" />

  <!-- Parallel HTTP Chunk Streaks (Indicating Multi-Threaded Chunking) -->
  <g fill="#38bdf8" opacity="0.8">
    <rect x="251" y="146" width="10" height="26" rx="5" />
    <rect x="251" y="184" width="10" height="38" rx="5" />
    <rect x="251" y="234" width="10" height="50" rx="5" />
  </g>

  <!-- Speed Dot Accents -->
  <circle cx="256" cy="418" r="5" fill="#38bdf8" filter="url(#subtleGlow)" />
  <circle cx="216" cy="412" r="3.5" fill="#06b6d4" opacity="0.7" />
  <circle cx="296" cy="412" r="3.5" fill="#06b6d4" opacity="0.7" />
</svg>
