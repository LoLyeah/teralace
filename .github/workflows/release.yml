name: Release Multiplatform (Windows, macOS, Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--bundles nsis'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin --bundles dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Version from Git Tag
        run: node scripts/sync_version.cjs

      - name: Generate Changelog
        id: changelog
        run: node scripts/generate_changelog.cjs

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Frontend Dependencies & Build Bundle
        run: |
          npm install
          npm run build

      - name: Build Desktop Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'TeraLace ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package Portable Windows Executable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-portable
          $exe = Get-ChildItem -Path src-tauri\target\release -Filter "*.exe" -File | Where-Object { $_.Name -like "*teralace*" -or $_.Name -like "*TeraLace*" } | Select-Object -First 1
          if ($exe) {
            Write-Host "Found standalone executable: $($exe.FullName)"
            Copy-Item -Path $exe.FullName -Destination dist-portable\TeraLace.exe
            $zipPath = "dist-portable\TeraLace_${env:APP_VERSION}_x64_portable.zip"
            Write-Host "Compressing portable zip: $zipPath"
            Compress-Archive -Path dist-portable\TeraLace.exe -DestinationPath $zipPath
            Get-ChildItem -Path dist-portable
          } else {
            Write-Error "No standalone executable found in src-tauri\target\release!"
          }

      - name: Upload Portable Windows Release
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist-portable/TeraLace_*_x64_portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Version from Git Tag
        run: node scripts/sync_version.cjs

      - name: Generate Changelog
        id: changelog
        run: node scripts/generate_changelog.cjs

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android NDK & Platform Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install Frontend Dependencies & Build Bundle
        run: |
          npm install
          npm run build

      - name: Initialize Android Target & Inject Permissions
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi
          node scripts/inject_android_perms.cjs

      - name: Build Android Release APK
        run: |
          chmod +x src-tauri/gen/android/gradlew || true
          npx tauri android build --apk --target aarch64 --ci > android_build.log 2>&1 || {
            echo "====== ANDROID BUILD FAILED. LOG TAIL: ======"
            tail -n 120 android_build.log
            exit 1
          }

      - name: Push Android Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-android
          git add -f android_build.log || true
          git commit -m "debug: android build output" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" debug-android || true

      - name: Sign & Package Android APK
        run: |
          keytool -genkey -v -keystore app.keystore -alias teralace -keyalg RSA -keysize 2048 -validity 10000 -storepass teralace123 -keypass teralace123 -dname "CN=TeraLace, OU=App, O=TeraLace, L=City, S=State, C=US"
          mkdir -p dist-apk
          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          for f in $(find src-tauri/gen/android/app/build/outputs/apk/ -name "*.apk"); do
            echo "Signing $f..."
            "$APKSIGNER" sign --ks app.keystore --ks-pass pass:teralace123 --ks-key-alias teralace --key-pass pass:teralace123 "$f"
            "$APKSIGNER" verify "$f"
            cp "$f" "dist-apk/TeraLace_${APP_VERSION}_universal.apk"
          done
          ls -la dist-apk/

      - name: Upload Android APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
