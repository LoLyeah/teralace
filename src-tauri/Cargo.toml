[package]
name = "teralace"
version = "1.2.4"
description = "Teralace - Fast and resilient multiplatform TeraBox file downloader"
authors = ["LoLyeah"]
license = "GPL-3.0"
homepage = "https://github.com/LoLyeah/teralace"
repository = "https://github.com/LoLyeah/teralace"
keywords = ["terabox", "downloader", "tauri", "desktop", "linux", "appimage", "android"]
categories = ["multimedia::download", "network-programming"]
edition = "2021"

[lib]
name = "teralace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for TeraBox API and chunk streaming
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "deflate", "stream", "rustls-tls"] }
futures-util = "0.3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Regex for URL parsing
regex = "1"

# URL parsing and encoding
url = "2"
urlencoding = "2"

# Base64 encoding/decoding
base64 = "0.22"

# Random number generation
rand = "0.8"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "1"
anyhow = "1"

# Async trait support
async-trait = "0.1"

# UUID for download task IDs
uuid = { version = "1", features = ["v4"] }

dirs = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
